<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Aria: a background voice agent for macOS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- menu bar strip -->
  <rect x="0" y="0" width="1280" height="34" rx="0" fill="#ffffff" fill-opacity="0.04"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1">
    <circle cx="1120" cy="17" r="6" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="1120" cy="17" r="2.2" fill="#e2e8f0"/>
    <text x="1138" y="22">Aria</text>
    <text x="1190" y="22" fill="#64748b">9:41</text>
  </g>

  <!-- wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="190" font-size="104" font-weight="700" fill="#f8fafc" letter-spacing="-3">Aria</text>
    <text x="84" y="240" font-size="28" fill="#cbd5e1">A background voice agent for macOS</text>
    <text x="84" y="290" font-size="19" fill="#94a3b8">Say “Aria”, ask anything, keep working. Answers come back spoken.</text>
    <g font-size="15" fill="#a5b4fc">
      <rect x="84" y="320" width="146" height="32" rx="16" fill="#6366f1" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="157" y="341" text-anchor="middle">40+ tools</text>
      <rect x="242" y="320" width="166" height="32" rx="16" fill="#6366f1" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="325" y="341" text-anchor="middle">Claude ⇄ Groq</text>
      <rect x="420" y="320" width="150" height="32" rx="16" fill="#6366f1" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="495" y="341" text-anchor="middle">local Whisper</text>
    </g>
  </g>

  <!-- waveform -->
  <g transform="translate(700 200)" fill="url(#wave)">
    <rect x="0"   y="-10" width="10" height="20"  rx="5"/>
    <rect x="22"  y="-22" width="10" height="44"  rx="5"/>
    <rect x="44"  y="-40" width="10" height="80"  rx="5"/>
    <rect x="66"  y="-62" width="10" height="124" rx="5"/>
    <rect x="88"  y="-34" width="10" height="68"  rx="5"/>
    <rect x="110" y="-80" width="10" height="160" rx="5"/>
    <rect x="132" y="-52" width="10" height="104" rx="5"/>
    <rect x="154" y="-96" width="10" height="192" rx="5"/>
    <rect x="176" y="-66" width="10" height="132" rx="5"/>
    <rect x="198" y="-108" width="10" height="216" rx="5"/>
    <rect x="220" y="-74" width="10" height="148" rx="5"/>
    <rect x="242" y="-92" width="10" height="184" rx="5"/>
    <rect x="264" y="-48" width="10" height="96"  rx="5"/>
    <rect x="286" y="-70" width="10" height="140" rx="5"/>
    <rect x="308" y="-36" width="10" height="72"  rx="5"/>
    <rect x="330" y="-56" width="10" height="112" rx="5"/>
    <rect x="352" y="-26" width="10" height="52"  rx="5"/>
    <rect x="374" y="-40" width="10" height="80"  rx="5"/>
    <rect x="396" y="-16" width="10" height="32"  rx="5"/>
    <rect x="418" y="-24" width="10" height="48"  rx="5"/>
    <rect x="440" y="-8"  width="10" height="16"  rx="5"/>
  </g>

  <!-- listening pill -->
  <g transform="translate(790 340)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="-20" width="292" height="40" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <circle cx="24" cy="0" r="7" fill="#f43f5e"/>
    <circle cx="24" cy="0" r="12" fill="none" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="2"/>
    <text x="46" y="6" font-size="16" fill="#e2e8f0">Listening… “what about tomorrow?”</text>
  </g>
</svg>
